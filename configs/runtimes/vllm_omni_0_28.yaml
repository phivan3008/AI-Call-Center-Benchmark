# Shared serving environment for models served by vLLM-Omni (Qwen3-Omni, MiniCPM-o 4.5).
# Source: https://docs.vllm.ai/projects/vllm-omni/en/latest/getting_started/installation/gpu/
# (vLLM-Omni 0.28.0 requires vLLM 0.28.0 and Python 3.12). Installed from PyPI on the server.
runtime_id: vllm_omni_0_28
python: "3.12"
packages:
  - vllm==0.28.0
  - vllm-omni==0.28.0
torch_backend: auto

# MiniCPM-o 4.5 stage 2 (Token2Wav) imports s3tokenizer / stepaudio2, which vLLM-Omni does
# not install by default (checkpoint 2, 2026-09-23: ModuleNotFoundError: No module named
# 's3tokenizer'). The recipe requires the MiniCPM-o flavoured vocoder package:
# https://github.com/vllm-project/vllm-omni/blob/v0.28.0/recipes/OpenBMB/MiniCPM-o-4_5.md
# ("Stage 2 loads Token2wav from ... PyPI package stepaudio2-minicpmo").
# Installed with a constraints file built from the already-installed packages so it cannot
# move torch / transformers / vllm versions.
# NOTE for Phase 9: the upstream `step-audio2` package (needed for StepAudio 2.5) conflicts
# with this one, so StepAudio 2.5 will need its own runtime_id / venv.
extra_packages:
  - stepaudio2-minicpmo==0.1.1

# vLLM-Omni worker subprocesses import cv2. vLLM pulls opencv-python-headless while other
# dependencies pull the GUI build opencv-python, which needs libGL.so.1. Both ship the same
# `cv2` package directory, so uninstalling one deletes the files of the other and leaves
# metadata behind (checkpoint 2, 2026-09-23: that produced ModuleNotFoundError: cv2).
# Therefore: remove both, then force a clean install of the headless build.
post_install:
  - args: [pip, uninstall, --python, "{python}", opencv-python]
    ignore_failure: true
    why: "GUI build may not be installed"
  - args: [pip, uninstall, --python, "{python}", opencv-python-headless]
    ignore_failure: true
    why: "headless build may not be installed"
  - args:
      [pip, install, --python, "{python}", --reinstall-package, opencv-python-headless,
       "opencv-python-headless>=4.13"]

# Imported inside the venv at prepare time: a missing dependency or system library must fail
# here, not as an orchestrator start-up timeout ten minutes into `vbench model serve`.
verify_imports: [vllm, vllm_omni, cv2, soundfile, s3tokenizer, stepaudio2]

serve_command: [vllm, serve]
