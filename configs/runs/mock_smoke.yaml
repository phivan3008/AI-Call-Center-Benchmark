# Chạy thử pipeline bằng mock adapter (chỉ CPU). Tạo run có is_mock=true, không bao giờ
# được xếp hạng. Dùng cho test và để kiểm tra server trước khi chạy model thật.
name: mock_smoke
description: Mock adapter end-to-end check of collect -> manifest -> bundle.
layers: [L1, L3]
samples_per_layer: 3
repeats: 1
seed: 1234
sample_timeout_s: 10
frame_ms: 20
input_sample_rate_hz: 16000
mock_only: true
