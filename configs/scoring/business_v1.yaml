# Cấu trúc business score (xem docs/METRIC_DEFINITIONS.md §7.2).
# Trọng số cấp cao (weight) cố định theo CLAUDE.md. Trọng số con (trong metrics) là ĐỀ XUẤT,
# chờ chủ dự án ký duyệt. Tổng trọng số con trong mỗi nhóm phải bằng 1.0.
version: business_v1
anchors: anchors_v1
status: proposed              # proposed (đề xuất) | signed_off (đã ký duyệt)
signed_off_by: null
signed_off_at: null

dimensions:
  japanese_quality:
    weight: 0.35
    metrics:
      l1.asr.cer: 0.25                     # biến thể: kana, kênh: audio
      l1.intent.macro_f1: 0.15
      l1.slot.f1: 0.15
      l1.understanding.accuracy: 0.15
      l1.keigo.compliance_rate: 0.20
      l1.long_context.recall_accuracy: 0.10
  task_completion:
    weight: 0.25
    metrics:
      l3.task.completion_rate: 0.60
      l3.tool.success_rate: 0.15
      l3.json.arg_accuracy: 0.15
      l3.tool.hallucination_rate: 0.10     # chiều down: được chấm là 1 - tỷ lệ thông qua anchor
  barge_in:
    weight: 0.15
    metrics:
      l2.interrupt.latency_ms.p95: 0.30
      l2.bargein.success_rate: 0.30
      l2.bargein.false_stop_rate: 0.15
      l2.ttfa_ms.p95: 0.25
  cost:
    weight: 0.15
    metrics:
      l5.cost.per_minute_usd: 1.00
  voice_quality:
    weight: 0.10
    metrics:
      l4.mos.human: 0.40
      l4.naturalness.human: 0.15
      l4.accent.human: 0.15
      l4.pronunciation.cer: 0.15
      l4.consistency.speaker_sim: 0.10
      l4.emotion.human: 0.05

primary_channel:
  stimulus: telephone_8k       # DATASET_SPEC §6 (kênh kích thích chính)
  response: audio              # METRIC_DEFINITIONS §1.3
