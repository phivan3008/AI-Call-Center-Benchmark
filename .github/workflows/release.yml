# Builds the offline release package that is carried to the GPU server.
# The GPU server cannot reach GitHub, so the operator downloads the zip from the
# GitHub Release page on the company PC and copies it to the server.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Build release package
        run: |
          uv sync --locked --group dev
          uv run vbench release build --out dist --tag "${GITHUB_REF_NAME}"
          ls -l dist
      - name: Verify the package from a clean extraction
        run: |
          mkdir -p /tmp/extract
          python3 -m zipfile -e dist/*.zip /tmp/extract
          cd /tmp/extract/*/
          uv sync --locked --group dev
          uv run vbench release verify
          uv run pytest -q
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Offline release package for the GPU server. Download both files, then follow docs/DEPLOYMENT_GUIDE.md section 6.1."
