[project]
name = "ai-callcenter-benchmark"
version = "0.2.4"
description = "Benchmark framework for native speech-to-speech models in Japanese AI call center deployment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "zstandard>=0.22",
    "nvidia-ml-py>=12.535",
    "numpy>=1.26",
    "soxr>=0.3.7",
    "websockets>=13.0",
    "huggingface_hub>=0.24",
]

[project.scripts]
vbench = "benchmark.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20", "PTH"]

[tool.mypy]
# No python_version pin: numpy stubs use syntax of the running interpreter (3.12 in CI).
strict = true
packages = ["benchmark"]

[[tool.mypy.overrides]]
module = ["pynvml", "soxr"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["benchmark"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
